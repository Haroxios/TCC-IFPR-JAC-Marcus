<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./menu.css">
    <title>Tela Inicial</title>
</head>

<body>

    <div id="container">

        <div id="cont_menuEsquerdo">
            <div id="cont_usuario">
                <h1 id="h1_usuario">Usuario</h1>
            </div>

            <div id="cont_documentosMenu">
                <p class="topicos_menuEsquerdo">Próximas Revisões</p>
                <a class="link_menuEsquerdo" href="../documento/documento.html">Revisão</a>
                <p class="topicos_menuEsquerdo">Cadernos(3x~)</p>
                <a class="link_menuEsquerdo" href="">Caderno</a>
            </div>

            <div id="cont_btnMenuEsquerdo">
                <button id="btn_criar">+</button>
                <a id="btn_sair" href="../index.html">Sair</a>
            </div>

        </div>

        <div id="cont_painel">
            <div id="cont_menuSuperior">
                <div id="cont_filtros">
                    <button id="btn_novaPasta" class="btn_confA">Nova Pasta</button>
                    <button id="btn_ordenar" class="btn_confA">Ordenar</button>
                    <button id="btn_filtrar" class="btn_confA">Filtrar</button>
                </div>

                <div id="cont_pesquisa">
                    <input type="text" id="inp_procurar" placeholder="Procurar">
                    <button id="btn_procurar" class="btn_contB">→</button>
                </div>
            </div>

            <div id="cont_documentos">
                <div id="cont_documento">
                    <div id="cont_status">
                        <div id="cont_statusAtual"></div>
                    </div>
                    <div id="cont_titulo">
                        <h1 id="tituloDoc">Titulo</h1>
                    </div>
                    
                    <div id="cont_trecho">
                        <p id="trechoDoc">Pequeno trecho do documento</p>
                    </div>

                    <div id="cont_tags">
                        <div id="cont_tag">
                            <p id="tagDoc"># Tag</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="./menu.js"></script>
</body>
</html>
