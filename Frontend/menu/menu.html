<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="icon" href="../favico.ico" type="image/ico">

    <link rel="stylesheet" href="./menu.css">
    <title>Tela Inicial</title>
</head>

<body>

    <div id="container">

        <div id="cont_menuEsquerdo">
            <div id="cont_usuario">
                <h1 id="h1_usuario">Usuario</h1>
            </div>

            <div id="cont_documentosMenu">
                <div id="cont_proximasRevisoes">
                    <p class="topicos_menuEsquerdo">Próximas Revisões</p>
                </div>

                <div id="cont_listaCadernos">
                    <p class="topicos_menuEsquerdo">Cadernos</p>
                </div>
            </div>

            <div id="cont_btnMenuEsquerdo">
                <button id="btn_criar">+</button>
                <a id="btn_sair" href="../index.html">Sair</a>
            </div>

        </div>

        <div id="cont_painel">
            <div id="cont_menuSuperior">
                <div id="cont_filtros">
                    <button id="btn_ordenar" class="btn_confA">Ordenar</button>
                    <button id="btn_filtrar" class="btn_confA">Filtrar</button>
                </div>

                <div id="cont_pesquisa">
                    <input type="text" id="inp_procurar" placeholder="Procurar">
                    <button id="btn_procurar" class="btn_contB">→</button>
                </div>
            </div>

            <div id="cont_documentos"></div>
        </div>
    </div>
    
    <script src="./menu.js"></script>
</body>
</html>
