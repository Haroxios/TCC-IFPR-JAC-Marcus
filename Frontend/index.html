<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="icon" href="./favico.ico" type="image/ico">

    <link rel="stylesheet" href="./index.css">
    <title>Login</title>
</head>

<body>

    <div id="container">

        <div id="cont_nomeProjeto">
            <h1>Revisão Web</h1>
        </div>

        <div id="cont_pagina">

            <div id="cont_apresentacao">
                <p id="p1">Bem-vindo!</p>
                <p id="p2">Acesse sua conta para continuar</p>
            </div>

            <div id="cont_dadosLogin">
                <label id="lbl_email">E-mail</label>
                <input type="email" id="inp_email" placeholder="exemplo@email.com">
                <label id="lbl_senha">Senha</label>
                <input type="password" id="inp_senha" placeholder="Digite sua senha">
            </div>

            <div id="cont_btnEntrar">
                <button id="btn_entrar">Entrar</button>
            </div>

        </div>

        <div id="cont_cadastroConta">
            <p>Não tem uma conta? <a href="./cadastro/cadastro.html">Cadastre-se</a>.</p>
        </div>

        </div>

        <script src="./index.js"></script>
    </body>
    </html>
